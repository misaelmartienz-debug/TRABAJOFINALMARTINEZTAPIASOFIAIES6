<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Conductores</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #444;
            color: white;
        }

        tr:hover {
            background-color: #f0f0f0;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
        }

        .btn-edit { background: #007bff; }
        .btn-delete { background: #dc3545; }
        .btn-new { 
            background: #28a745; 
            display: inline-block; 
            margin-bottom: 15px;
            color: white;
        }

    </style>
</head>

<body>

    <h1>Lista de Conductores</h1>

    <a href="/conductores/nuevo" class="btn btn-new">➕ REGISTRARSE </a> 

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Correo Electrónico</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="c : ${conductores}">
                <td th:text="${c.conductorId}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.apellido}"></td>
                <td th:text="${c.correoElectronico}"></td>
                <td th:text="${c.telefono}"></td>
                <td th:text="${c.direccion}"></td>

                <td>
                    <a th:href="@{/conductores/editar/{id}(id=${c.conductorId})}" class="btn btn-edit">
                        Editar
                    </a>

                    <a th:href="@{/conductores/eliminar/{id}(id=${c.conductorId})}" class="btn btn-delete">
                        Eliminar
                    </a>
                </td>
            </tr>
        </tbody>

    </table>

</body>

</html>
