<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar Vehículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">Elegí tu Vehículo</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">

    
        <div class="col" th:each="v : ${vehiculos}" th:if="${v.conductor != null}">
            <div class="card shadow">

                <div class="card-body">
                    <h5 class="card-title" th:text="${v.marca} + ' ' + ${v.modelo}"></h5>

                    <p class="card-text">
                        <strong>ID Vehículo:</strong> <span th:text="${v.idVehiculo}"></span><br>
                        <strong>Patente:</strong> <span th:text="${v.patente}"></span><br>
                        <strong>Tipo:</strong> <span th:text="${v.tipoVehiculo}"></span><br>
                        <strong>Color:</strong> <span th:text="${v.color}"></span><br><br>

                        <strong>Conductor:</strong><br>
                        ID:
                        <span th:text="${v.conductor != null ? v.conductor.conductorId : 'Sin conductor'}"></span><br>
                        Nombre:
                        <span th:text="${v.conductor != null ? v.conductor.nombre : '---'}"></span><br>
                        Apellido:
                        <span th:text="${v.conductor != null ? v.conductor.apellido : '---'}"></span>
                    </p>

                    <form th:action="@{/viajes/registrar}" method="post">
                        <input type="hidden" name="vehiculoId" th:value="${v.idVehiculo}">
                        <button class="btn btn-success w-100 mt-2">Seleccionar este vehículo</button>
                    </form>

                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <a href="/viajes/inicio" class="btn btn-secondary">Volver</a>
    </div>

</div>

</body>
</html>
