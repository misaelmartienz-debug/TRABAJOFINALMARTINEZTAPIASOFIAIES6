<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }

        .card {
            margin-top: 30px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="card shadow p-4">
            
          
            <h2 th:text="${usuario.usuarioId == null} ? 'Nuevo Usuario' : 'Editar Usuario'"></h2>

        
            <form th:action="${usuario.usuarioId == null} 
                                ? @{/usuario/guardar} 
                                : @{/usuarios/actualizar/{id}(id=${usuario.usuarioId})}"
                  th:object="${usuario}" 
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Nombre:</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

               
                <div class="mb-3">
                    <label class="form-label">Apellido:</label>
                    <input type="text" class="form-control" th:field="*{apellido}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="email" class="form-control" th:field="*{email}" required>
                </div>

              
                <div class="mb-3">
                    <label class="form-label">Teléfono:</label>
                    <input type="number" class="form-control" th:field="*{telefono}" 
                           min="1000000000" max="9999999999" required>
                </div>

               
                <div class="mb-3">
                    <label class="form-label">Dirección:</label>
                    <input type="text" class="form-control" th:field="*{direccion}">
                </div>

                
                <div class="d-flex justify-content-between mt-4">

                    <a href="/usuarios" class="btn btn-secondary">
                        Volver
                    </a>

                    <button type="submit" class="btn btn-success">
                        Guardar
                    </button>

                </div>

            </form>

        </div>
    </div>

</body>

</html>
