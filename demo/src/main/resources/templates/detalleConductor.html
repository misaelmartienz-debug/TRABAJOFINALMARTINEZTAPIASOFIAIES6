<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Conductor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Detalle del Conductor</h3>
        </div>

        <div class="card-body">

            <p><strong>ID:</strong> <span th:text="${conductor.conductorId}"></span></p>
            <p><strong>Nombre:</strong> <span th:text="${conductor.nombre}"></span></p>
            <p><strong>Apellido:</strong> <span th:text="${conductor.apellido}"></span></p>
            <p><strong>Email:</strong> <span th:text="${conductor.correoElectronico}"></span></p>
            <p><strong>Teléfono:</strong> <span th:text="${conductor.telefono}"></span></p>
            <p><strong>Dirección:</strong> <span th:text="${conductor.direccion}"></span></p>

            <a href="/conductores" class="btn btn-secondary mt-3">
                ⬅ Volver a la lista
            </a>

            <a th:href="@{'/conductores/editar/' + ${conductor.conductorId}}"
               class="btn btn-warning mt-3">
                ✏ Editar
            </a>

        </div>

    </div>

</div>

</body>
</html>
