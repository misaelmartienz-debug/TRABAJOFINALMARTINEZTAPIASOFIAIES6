<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Vehículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Detalle del Vehículo</h3>
        </div>

        <div class="card-body">

            <p><strong>ID:</strong> <span th:text="${vehiculo.idVehiculo}"></span></p>
            <p><strong>Marca:</strong> <span th:text="${vehiculo.marca}"></span></p>
            <p><strong>Modelo:</strong> <span th:text="${vehiculo.modelo}"></span></p>
            <p><strong>Patente:</strong> <span th:text="${vehiculo.patente}"></span></p>
            <p><strong>Color:</strong> <span th:text="${vehiculo.color}"></span></p>

            <a href="/vehiculos" class="btn btn-secondary mt-3">⬅ Volver a la lista</a>
            <a th:href="@{'/vehiculo/editar/' + ${vehiculo.idVehiculo}}"
               class="btn btn-warning mt-3">✏ Editar</a>

        </div>

    </div>

</div>

</body>
</html>
