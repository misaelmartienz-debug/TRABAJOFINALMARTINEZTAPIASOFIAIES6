<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - ExpressApp">ExpressApp</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .navbar {
            background: black;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .nav-link {
            color: #dcdcdc !important;
            margin-right: 15px;
        }

        .nav-link:hover {
            color: white !important;
        }
    </style>
</head>

<body class="bg-light">

   
    <nav class="navbar navbar-expand-lg px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">ExpressApp</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">

                <li><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li><a class="nav-link" th:href="@{/viajes/inicio}">Viajes</a></li>
                <li><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
                <li><a class="nav-link" th:href="@{/vehiculos}">Vehículos</a></li>
                <li><a class="nav-link" th:href="@{/conductores}">Conductores</a></li>

                <!-- SI NO HAY USUARIO EN SESIÓN -->
                <li class="nav-item" th:if="${session.usuarioLogueado == null}">
                    <a class="nav-link" th:href="@{/usuarios/nuevo}">Registrarse</a>
                </li>

                <!-- SI HAY USUARIO EN SESIÓN -->
                <li class="nav-item" th:if="${session.usuarioLogueado != null}">
                    <span class="nav-link text-success fw-bold">
                        👋 Hola,
                        <span th:text="${session.usuarioLogueado.nombre}"></span>
                    </span>
                </li>

            </ul>
        </div>
    </nav>

    
    <main class="container mt-4" layout:fragment="contenido"></main>

    
    <footer class="bg-dark text-white text-center p-3 mt-5">
        © 2025 ExpressApp — Derechos a Misael Martinez Sofia Tapia.
    </footer>

</body>

</html>
