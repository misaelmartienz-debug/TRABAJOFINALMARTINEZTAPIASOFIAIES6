<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Vehículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4 text-primary">🚗 Lista de Vehículos</h2>

    <a href="/vehiculo/nuevo" class="btn btn-success mb-3">➕ Registrar nuevo vehículo</a>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Patente</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="vehiculo : ${vehiculos}">
                <td th:text="${vehiculo.idVehiculo}"></td>
                <td th:text="${vehiculo.marca}"></td>
                <td th:text="${vehiculo.modelo}"></td>
                <td th:text="${vehiculo.patente}"></td>

                <td>
                    <a th:href="@{'/vehiculos/' + ${vehiculo.idVehiculo}}"
                       class="btn btn-info btn-sm text-white">Ver</a>

                    <a th:href="@{'/vehiculo/editar/' + ${vehiculo.idVehiculo}}"
                       class="btn btn-warning btn-sm">Editar</a>

                    <a th:href="@{'/vehiculos/eliminar/' + ${vehiculo.idVehiculo}}"
                       onclick="return confirm('¿Eliminar vehículo?');"
                       class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
