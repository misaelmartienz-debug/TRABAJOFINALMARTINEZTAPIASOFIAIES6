<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar tipo de viaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f4f4;
            font-family: Arial;
        }

        .card-tipo {
            border-radius: 12px;
            padding: 25px;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform .2s;
            cursor: pointer;
            text-align: center;
        }

        .card-tipo:hover {
            transform: scale(1.05);
        }

        .precio {
            font-size: 1.6rem;
            font-weight: bold;
            color: #28a745;
        }

        h2 {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Elegí el tipo de viaje</h2>

    <div class="row g-4">

        
        <div class="col-md-4">
            <form action="/viajes/seleccionar" method="get">
                <input type="hidden" name="tipoViaje" value="CORTA">
                <button class="card-tipo w-100" type="submit">
                    <h4>Viaje Corto</h4>
                    <p>Ideal para distancias cercanas</p>
                    <p class="precio">$7000</p>
                </button>
            </form>
        </div>

        <div class="col-md-4">
            <form action="/viajes/seleccionar" method="get">
                <input type="hidden" name="tipoViaje" value="MEDIA">
                <button class="card-tipo w-100" type="submit">
                    <h4>Viaje Medio</h4>
                    <p>Perfecto para desplazamientos intermedios</p>
                    <p class="precio">$10000</p>
                </button>
            </form>
        </div>

        <div class="col-md-4">
            <form action="/viajes/seleccionar" method="get">
                <input type="hidden" name="tipoViaje" value="LARGA">
                <button class="card-tipo w-100" type="submit">
                    <h4>Viaje Largo</h4>
                    <p>Ideal para largas distancias</p>
                    <p class="precio">$20000</p>
                </button>
            </form>
        </div>

    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-secondary">⬅ Volver al inicio</a>
    </div>

</div>

</body>
</html>
